name: Filter RU
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install geoip2 requests
      - run: |
          curl -L -o GeoLite2-Country.mmdb "https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-Country.mmdb"
          curl -L -o GeoLite2-ASN.mmdb "https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-ASN.mmdb"
          ls -lh GeoLite2-*.mmdb
      - run: python filter.py
      - name: End-to-end protocol test (sing-box, same core as Karing)
        env:
          E2E_RETRY: "0"  # nightly run is fast mode; local .bat keeps the retry
        run: |
          SB_VER=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/SagerNet/sing-box/releases/latest | sed 's|.*/tag/v||')
          [ -z "$SB_VER" ] && SB_VER=1.14.4
          echo "sing-box ${SB_VER}"
          curl -fsSL -o /tmp/sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tgz -C /tmp
          sudo mv /tmp/sing-box-${SB_VER}-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version
          python protocol_test.py .
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add clean*.txt dead.txt history.json
          git diff --staged --quiet || git commit -m "auto: filtered + e2e verified"
          git push
